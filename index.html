*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(122,92,255,.25),transparent 30%),radial-gradient(circle at 85% 15%,rgba(255,79,163,.22),transparent 28%),linear-gradient(180deg,#050816,#091127 55%,#050816)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{width:100%;max-width:none;margin:auto;padding:12px}.hero{border:1px solid rgba(255,255,255,.09);background:rgba(14,23,48,.94);border-radius:22px;padding:11px 14px;box-shadow:0 18px 55px rgba(0,0,0,.48);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:6px;z-index:25;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:14px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:conic-gradient(from 210deg,var(--pink),var(--purple),var(--cyan),var(--pink));box-shadow:0 0 35px rgba(122,92,255,.45)}h1{margin:0;font-size:clamp(20px,3vw,30px)}.sub{color:var(--muted);font-size:13px;margin-top:4px}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{border:none;color:white;padding:8px 10px;border-radius:11px;background:#1b2a52;border:1px solid rgba(255,255,255,.08);transition:.18s;font-size:13px}.btn:hover{transform:translateY(-2px);filter:brightness(1.15)}.btn.primary{background:linear-gradient(135deg,var(--purple),#5a3ddd)}.btn.gold{background:linear-gradient(135deg,#f4b83f,var(--gold));color:#251c06}.btn.red{background:linear-gradient(135deg,#d83f58,var(--red))}.btn.green{background:linear-gradient(135deg,#21b95d,var(--green));color:#061d0f}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;margin-top:12px}.panel{background:rgba(14,23,48,.85);border:1px solid rgba(255,255,255,.08);border-radius:22px;box-shadow:0 18px 55px rgba(0,0,0,.48)}.board-panel{padding:11px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.panel-head h2{margin:0;font-size:17px}.badge{padding:7px 10px;border-radius:999px;background:rgba(51,214,255,.1);border:1px solid rgba(51,214,255,.24);color:#9cebff;font-size:12px;font-weight:800}.board-wrap{overflow:visible;padding-bottom:0}.board{width:100%;min-width:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}.category{min-width:0;min-height:58px;padding:8px 4px;border-radius:12px;text-align:center;font-size:clamp(8px,.72vw,11px);line-height:1.15;font-weight:900;text-transform:uppercase;letter-spacing:.25px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere;background:linear-gradient(180deg,#21366b,#17254a);border:1px solid rgba(255,255,255,.1)}.card{position:relative;min-width:0;min-height:76px;border:none;border-radius:12px;color:white;font-size:clamp(16px,1.35vw,22px);font-weight:950;background:linear-gradient(145deg,#25457f,#1a2f5c);border:1px solid rgba(255,255,255,.1);box-shadow:0 7px 15px rgba(0,0,0,.28);overflow:hidden;transition:.22s}.card:hover{transform:translateY(-4px) scale(1.015)}.card.used{opacity:.14;filter:grayscale(1);pointer-events:none}.card.hard{background:linear-gradient(145deg,#7b42df,#3e2588)}.card.mystery{background:linear-gradient(145deg,#f2a62f,#8a5711)}.card.steal{background:linear-gradient(145deg,#16b3c7,#0d6075)}.card.minus{background:linear-gradient(145deg,#d44763,#6e2131)}.card.bonus{background:linear-gradient(145deg,#31bf72,#17623d)}.card.battle{background:linear-gradient(145deg,#ff6f3d,#8d3219)}.smalltag{position:absolute;right:4px;top:4px;font-size:clamp(6px,.48vw,8px);padding:3px 4px;border-radius:6px;background:rgba(0,0,0,.3);letter-spacing:.2px}.sidebar{padding:11px;position:sticky;top:94px;height:max-content}.teams{display:grid;gap:10px}.team{padding:9px;border-radius:14px;background:linear-gradient(145deg,#18264e,#111d3c);border:1px solid rgba(255,255,255,.08)}.team.active{outline:2px solid var(--cyan);box-shadow:0 0 0 5px rgba(51,214,255,.1),0 0 28px rgba(51,214,255,.2)}.team-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.08)}.team-name{font-weight:850;flex:1}.turn{font-size:9px;letter-spacing:.8px;color:#9cebff;font-weight:900}.score{font-size:25px;font-weight:950;margin:5px 0 3px}.statuses{display:flex;gap:5px;flex-wrap:wrap;min-height:22px}.status{font-size:9px;padding:4px 6px;border-radius:999px;background:rgba(255,255,255,.07)}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.mini{border:none;border-radius:9px;padding:7px;color:white;background:#243866}.log{max-height:215px;overflow:auto;display:grid;gap:7px;color:var(--muted);font-size:12px}.log-entry{padding:8px;border-radius:10px;background:rgba(255,255,255,.04)}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:100;background:rgba(2,5,13,.86);backdrop-filter:blur(10px)}.modal.show{display:flex}.dialog{width:min(820px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#111d3b,#0d1730);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.6)}.dialog.large{width:min(1200px,100%)}.eyebrow{font-size:11px;color:#9cebff;text-transform:uppercase;letter-spacing:1px;font-weight:900}.question{white-space:pre-line;font-size:clamp(24px,4vw,42px);font-weight:950;line-height:1.15;margin:22px 0}.answer,.hint{display:none;padding:15px;border-radius:14px;margin-top:10px}.answer{background:rgba(78,229,139,.1);border:1px solid rgba(78,229,139,.25)}.hint{background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.25)}.answer.show,.hint.show{display:block}.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}.choice{border:none;border-radius:12px;padding:12px;background:#1d315f;color:white;font-weight:850}.choice.selected{outline:2px solid var(--cyan)}.reveal-stage{text-align:center;padding:15px}.box{font-size:92px}.reveal-title{font-size:34px;font-weight:950;margin:15px 0 6px}.boss{text-align:center;background:radial-gradient(circle at 50% 20%,rgba(255,79,163,.18),transparent 35%),linear-gradient(180deg,#141638,#0c122b)}.boss-icon{font-size:92px}.wagers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.wager{padding:12px;border-radius:14px;background:#17264c}label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}input,textarea,select{width:100%;padding:10px;border-radius:10px;background:#091329;color:white;border:1px solid rgba(255,255,255,.1)}textarea{min-height:82px;resize:vertical}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.edit-list{display:grid;gap:10px;margin-top:14px}.edit-row{display:grid;grid-template-columns:1.1fr .55fr .65fr .8fr auto;gap:8px;align-items:center;padding:10px;background:rgba(255,255,255,.03);border-radius:14px}.toast{position:fixed;right:18px;bottom:18px;padding:12px 16px;background:#18264c;border:1px solid rgba(255,255,255,.1);border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s;z-index:200}.toast.show{opacity:1;transform:none}@media(max-width:1180px){.layout{grid-template-columns:1fr}.sidebar{position:static}.board{grid-template-columns:repeat(8,minmax(82px,1fr));}.board-wrap{overflow-x:auto}.hero{position:static}}@media(max-width:700px){.app{padding:9px}.hero{align-items:flex-start;flex-direction:column}.editor-grid,.edit-row{grid-template-columns:1fr}}
</style>

<body>
<div class="app"><header class="hero"><div class="brand"><div class="logo">🎮</div><div><h1 id="title">Quest Arena Deluxe</h1><div class="sub">Arcade quiz battles, power-ups, steals, traps, and a Final Boss</div></div></div><div class="actions"><button class="btn primary" onclick="openEditor()">✏️ Build Game</button><button class="btn" onclick="addTeam()">＋ Team</button><button class="btn gold" onclick="openFinalBoss()">👑 Final Boss</button><button class="btn red" onclick="resetGame()">↻ Reset</button></div></header><div class="layout"><section class="panel board-panel"><div class="panel-head"><h2>Battle Board</h2><div class="badge" id="turnBadge">Choose a card</div></div><div class="board-wrap"><div class="board" id="board"></div></div></section><aside class="panel sidebar"><div class="panel-head"><h2>Teams</h2><button class="btn" onclick="nextTurn()">Next</button></div><div id="teams" class="teams"></div><div class="panel-head" style="margin-top:16px"><h2>Game Feed</h2></div><div id="log" class="log"></div></aside></div></div>
<div id="questionModal" class="modal"><div class="dialog"><div class="eyebrow" id="qCategory"></div><div id="qMeta" style="font-weight:900;margin-top:5px"></div><div class="question" id="qText"></div><div class="hint" id="qHint"></div><div class="answer" id="qAnswer"></div><div class="modal-actions"><button class="btn" onclick="showHint()">💡 Hint</button><button class="btn" onclick="showAnswer()">👁 Answer</button><button class="btn green" onclick="awardCorrect()">✓ Correct</button><button class="btn red" onclick="markWrong()">✕ Wrong</button><button class="btn gold" onclick="openStealPanel()">⚡ Steal</button><button class="btn" onclick="closeModal('questionModal')">Close</button></div><div id="stealPanel" style="display:none;margin-top:16px"><div class="eyebrow">Choose stealing team</div><div id="stealTeams" class="choice-grid"></div><div class="modal-actions"><button class="btn green" onclick="resolveSteal(true)">Steal Correct</button><button class="btn red" onclick="resolveSteal(false)">Steal Wrong</button></div></div></div></div>
<div id="eventModal" class="modal"><div class="dialog reveal-stage"><div class="box" id="eventIcon">🎁</div><div class="eyebrow">Mystery Event</div><div class="reveal-title" id="eventTitle">Open it?</div><div id="eventText" style="color:var(--muted)">Anything can happen.</div><div class="modal-actions" style="justify-content:center"><button id="revealBtn" class="btn gold" onclick="revealEvent()">Reveal</button><button class="btn" onclick="closeEvent()">Close</button></div></div></div>
<div id="bossModal" class="modal"><div class="dialog boss"><div class="boss-icon">🐉</div><div class="eyebrow">Final Boss</div><div class="question" id="bossQuestion"></div><div class="answer" id="bossAnswer"></div><div class="wagers" id="wagers"></div><div class="modal-actions" style="justify-content:center"><button class="btn" onclick="document.getElementById('bossAnswer').classList.add('show')">Show Answer</button><button class="btn gold" onclick="scoreBoss()">Score Final Boss</button><button class="btn" onclick="closeModal('bossModal')">Close</button></div></div></div>
<div id="editorModal" class="modal"><div class="dialog large"><div class="panel-head"><div><div class="eyebrow">Game Builder</div><h2 style="margin:4px 0 0">Customize Everything</h2></div><button class="btn" onclick="closeModal('editorModal')">Close</button></div><div class="editor-grid"><div><label>Game title</label><input id="editTitle"></div><div><label>Final Boss question</label><input id="editBossQ"></div><div style="grid-column:1/-1"><label>Final Boss answer</label><input id="editBossA"></div></div><div class="panel-head" style="margin-top:18px"><h2>Cards</h2><button class="btn primary" onclick="addCard()">＋ Add Card</button></div><div id="editList" class="edit-list"></div><div class="modal-actions"><button class="btn green" onclick="saveEditor()">Save Game</button><button class="btn" onclick="exportGame()">Export JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Import JSON</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importGame(event)"></div></div></div>

const defaultGame={"title":"The Cross Challenge","bossQuestion":"FINAL BOSS: Without looking, name the 12 stations of the Procession of the Cross in the correct order.","bossAnswer":"1) Main Sanctuary 2) St. Mary 3) Archangel Gabriel 4) Archangel Michael 5) St. Mark 6) Apostles 7) Any Martyr 8) Any Saint 9) Northern Door 10) Immersion Font 11) Southern Door 12) St. John the Baptist","questions":[{"category":"Seven Words","points":100,"type":"normal","question":"Who did Jesus ask the Father to forgive?\n\nA) His disciples\nB) His crucifiers\nC) The right-hand thief\nD) The Roman governor","answer":"B) His crucifiers","hint":"This was the first word on the Cross."},{"category":"Seven Words","points":200,"type":"normal","question":"Complete the verse:\n\u201cToday you will be with Me in ______.\u201d","answer":"Paradise","hint":"Jesus said this to the right-hand thief."},{"category":"Seven Words","points":300,"type":"hard","question":"Which word from the Cross showed Jesus caring for His mother and St. John?","answer":"\u201cWoman, behold your son!\u201d and \u201cBehold your mother!\u201d","hint":"It is recorded in John 19:26-27."},{"category":"Seven Words","points":400,"type":"steal","question":"Put these words in their correct order from first to last:\n\u201cI thirst\u201d \u2022 \u201cIt is finished\u201d \u2022 \u201cFather, into Your hands I commit My spirit.\u201d","answer":"1) \u201cI thirst.\u201d 2) \u201cIt is finished.\u201d 3) \u201cFather, into Your hands I commit My spirit.\u201d","hint":"These are words 5, 6, and 7."},{"category":"Seven Words","points":500,"type":"hard","question":"Name all seven words of Christ on the Cross in order.","answer":"1) Father, forgive them... 2) Today you will be with Me in Paradise. 3) Woman, behold your son... Behold your mother. 4) My God, My God, why have You forsaken Me? 5) I thirst. 6) It is finished. 7) Father, into Your hands I commit My spirit.","hint":"Think forgiveness, Paradise, care, suffering, thirst, victory, surrender."},{"category":"Meaning & Lessons","points":100,"type":"normal","question":"The first word on the Cross mainly teaches us about:\n\nA) Courage\nB) Forgiveness\nC) Fasting\nD) Silence","answer":"B) Forgiveness","hint":"Jesus prayed for those who crucified Him."},{"category":"Meaning & Lessons","points":200,"type":"normal","question":"Why should we never despise anyone, according to the lesson of the right-hand thief?","answer":"They may repent and enter Paradise before us.","hint":"The thief changed through faith and repentance."},{"category":"Meaning & Lessons","points":300,"type":"hard","question":"What two kinds of thirst are explained in the words \u201cI thirst\u201d?","answer":"Physical thirst and spiritual thirst for the salvation of humanity.","hint":"One concerned His body and one concerned salvation."},{"category":"Meaning & Lessons","points":400,"type":"hard","question":"\u201cMy God, My God, why have You forsaken Me?\u201d does NOT mean what two things?","answer":"It does not mean Christ\u2019s divinity separated from His humanity, and it does not mean the Father abandoned the Son.","hint":"Recall the confession in the Divine Liturgy."},{"category":"Meaning & Lessons","points":500,"type":"steal","question":"Explain why \u201cIt is finished\u201d is called a cry of joy and victory. Give two accomplishments mentioned in the lesson.","answer":"Christ completed salvation and redemption, fulfilled the prophecies, reconciled heaven and earth, crushed the serpent\u2019s head, established His spiritual kingdom, and defeated Satan. Any two.","hint":"This was not a cry of defeat."},{"category":"Penalty Zone","points":100,"type":"minus","question":"Complete the verse:\n\u201cFather, forgive them, for they do not know what they ____.\u201d","answer":"do","hint":"Luke 23:34."},{"category":"Penalty Zone","points":200,"type":"minus","question":"Which station comes directly after the icon of St. Mary?\n\nA) St. Mark\nB) Archangel Gabriel\nC) Archangel Michael\nD) The Apostles","answer":"B) Archangel Gabriel","hint":"It is station 3."},{"category":"Penalty Zone","points":300,"type":"minus","question":"Complete the verse:\n\u201cStrive to enter through the ______ gate.\u201d","answer":"narrow","hint":"This is connected to the Northern Door."},{"category":"Penalty Zone","points":400,"type":"minus","question":"Name the three actions performed at every procession station, in the correct order.","answer":"A psalm is chanted, then the Gospel is read, then the Gospel Response is said with an additional verse for the Cross.","hint":"Psalm, Gospel, response."},{"category":"Penalty Zone","points":500,"type":"minus","question":"Name stations 9 through 12 in order and give the main spiritual meaning of each.","answer":"9) Northern Door \u2014 the Cross is the narrow gate and the path of repentance, struggle, and self-denial. 10) Immersion Font \u2014 through baptism we die and rise with Christ and are cleansed from sin. 11) Southern Door \u2014 the Cross is Christ\u2019s royal procession and throne, opening the gates of righteousness. 12) St. John the Baptist \u2014 prepare the Lord\u2019s way through repentance, self-denial, and witnessing to Christ.","hint":"Door, font, door, Baptist."},{"category":"Complete the Verse","points":100,"type":"normal","question":"Fill in the blank:\n\u201cFather, ______ them, for they do not know what they do.\u201d","answer":"forgive","hint":"Luke 23:34."},{"category":"Complete the Verse","points":200,"type":"normal","question":"Fill in the blank:\n\u201cRemember me, O Lord, when You come into Your ______.\u201d","answer":"kingdom","hint":"The prayer of the right-hand thief."},{"category":"Complete the Verse","points":300,"type":"hard","question":"Fill in the blanks:\n\u201cLove your ______, do good to those who ______ you, bless those who curse you, and pray for those who spitefully use you.\u201d","answer":"enemies; hate","hint":"Luke 6:27-28."},{"category":"Complete the Verse","points":400,"type":"hard","question":"Fill in the blanks:\n\u201cIf anyone desires to come after Me, let him deny ______, and take up his ______, and follow Me.\u201d","answer":"himself; cross","hint":"Matthew 16:24."},{"category":"Complete the Verse","points":500,"type":"steal","question":"Complete the full response used during the procession:\n\u201cThrough His Cross, and His holy Resurrection, He restored ______ once again to the ______.\u201d","answer":"man; Paradise","hint":"This additional verse is said for the Cross."},{"category":"Cross Procession","points":100,"type":"normal","question":"How many times each year is the procession of the Cross celebrated?","answer":"Three times","hint":"Two Cross feasts and Palm Sunday."},{"category":"Cross Procession","points":200,"type":"normal","question":"On which three occasions is the procession of the Cross celebrated?","answer":"The Feast of the Cross on Thoout 17 (September 27), the Feast of the Cross on Paremhotep 10 (March 19), and Palm Sunday.","hint":"Two feasts plus one Sunday."},{"category":"Cross Procession","points":300,"type":"hard","question":"How many stations are in the procession, and into how many main groups are they divided?","answer":"12 stations divided into 3 main groups.","hint":"The title of Lesson 4 includes the number of stops."},{"category":"Cross Procession","points":400,"type":"hard","question":"At each station, what three things happen in order?","answer":"A psalm is chanted, then the Gospel is read, then the Gospel Response is said with an additional verse for the Cross.","hint":"Psalm, Gospel, response."},{"category":"Cross Procession","points":500,"type":"steal","question":"Name the three main categories of the 12 stations.","answer":"1) The Story of Salvation & Servants of Salvation 2) Icons of Salvation 3) Concerning the Church / The Sanctuary of the Church","hint":"The groups move from salvation history, to witnesses, to the Church."},{"category":"Stations 1\u20136","points":100,"type":"normal","question":"What is the first station of the procession?","answer":"Before the Main Sanctuary","hint":"Its door symbolizes the gate of heaven."},{"category":"Stations 1\u20136","points":200,"type":"normal","question":"Which station remembers the Visitation of St. Mary to St. Elizabeth?","answer":"Before the icon of St. Mary the Mother of God","hint":"The Gospel is Luke 1:38-56."},{"category":"Stations 1\u20136","points":300,"type":"hard","question":"Which archangel brought the good news of the Incarnation to St. Mary?","answer":"Archangel Gabriel","hint":"This is station 3."},{"category":"Stations 1\u20136","points":400,"type":"hard","question":"What did Archangel Michael proclaim when the stone was rolled away from the tomb?","answer":"The holy Resurrection of the Lord","hint":"This is connected with station 4."},{"category":"Stations 1\u20136","points":500,"type":"battle","question":"Match stations 5 and 6 with their Gospel readings and meaning:\nSt. Mark \u2022 Apostles","answer":"St. Mark: Luke 10:1-12, sending the 70 apostles, carrying the cross of ministry. Apostles: Matthew 10:1-8, preaching that the kingdom is at hand, carrying the cross of preaching throughout the world.","hint":"Both stations are in Icons of Salvation."},{"category":"Stations 7\u201312","points":100,"type":"normal","question":"At station 7, the procession stands before the icon of whom?","answer":"Any martyr, usually St. George or St. Mina","hint":"The Cross represents sacrifice and persecution."},{"category":"Stations 7\u201312","points":200,"type":"normal","question":"Which saint is typically used for station 8?","answer":"St. Anthony","hint":"He represents self-denial and ascetic struggle."},{"category":"Stations 7\u201312","points":300,"type":"hard","question":"Which station teaches that the Cross is the narrow gate?","answer":"Station 9, before the Northern Door","hint":"The Gospel says, \u201cStrive to enter through the narrow gate.\u201d"},{"category":"Stations 7\u201312","points":400,"type":"hard","question":"What does station 10, before the immersion font, teach about baptism?","answer":"Through baptism we die and rise with Christ, are cleansed from sin, and put on the new man through the salvation accomplished by the Cross.","hint":"The Gospel is Christ\u2019s baptism."},{"category":"Stations 7\u201312","points":500,"type":"steal","question":"Identify stations 11 and 12, including the Gospel event or main lesson connected with each.","answer":"11: Before the Southern Door - Christ\u2019s entry into Jerusalem on Palm Sunday; the Cross is the royal procession and throne of the King. 12: Before the icon of St. John the Baptist - prepare the Lord\u2019s way through self-denial, repentance, and witnessing to Christ.","hint":"The final two stations are the Southern Door and St. John the Baptist."},{"category":"Mystery Box","points":0,"type":"mystery","question":"Mystery Event","answer":"","hint":""},{"category":"Mystery Box","points":0,"type":"mystery","question":"Mystery Event","answer":"","hint":""},{"category":"Mystery Box","points":0,"type":"mystery","question":"Mystery Event","answer":"","hint":""},{"category":"Mystery Box","points":0,"type":"mystery","question":"Mystery Event","answer":"","hint":""},{"category":"Mystery Box","points":0,"type":"mystery","question":"Mystery Event","answer":"","hint":""}]};

{icon:'📖',title:'Bible Helper',text:'On your next multiple-choice question, the host may remove two wrong answers.',action:'helper'},
{icon:'🎯',title:'Bonus Challenge',text:'Answer a surprise lesson question for 200 points.',action:'bonusChallenge'},
{icon:'🌟',title:'Blessing +200',text:'Gain 200 points now.',action:'add',value:200},
{icon:'🌧️',title:'Setback -200',text:'Lose 200 points now.',action:'minus',value:200}
];
function save(){localStorage.setItem('crossLessonsGameV1',JSON.stringify(game));localStorage.setItem('crossLessonsTeamsV1',JSON.stringify(teams));localStorage.setItem('crossLessonsUsedV1',JSON.stringify(used));localStorage.setItem('crossLessonsActiveV1',activeTeam)}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function log(m){const d=document.createElement('div');d.className='log-entry';d.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' — '+m;document.getElementById('log').prepend(d)}
function renderBoard(){document.getElementById('title').textContent=game.title;const b=document.getElementById('board');b.innerHTML='';const cats=[...new Set(game.questions.map(q=>q.category))].slice(0,8);cats.forEach(c=>{const h=document.createElement('div');h.className='category';h.textContent=c;b.appendChild(h)});const groups=cats.map(c=>game.questions.map((q,i)=>({...q,index:i})).filter(q=>q.category===c));const max=Math.max(...groups.map(g=>g.length));for(let r=0;r<max;r++)groups.forEach(g=>{const q=g[r];if(!q){b.appendChild(document.createElement('div'));return}const x=document.createElement('button');x.className=`card ${q.type} ${used.includes(q.index)?'used':''}`;x.innerHTML=`${q.type==='mystery'?'?':Math.abs(q.points)}<span class="smalltag">${q.type.toUpperCase()}</span>`;x.onclick=()=>openCard(q.index);b.appendChild(x)})}
function renderTeams(){const w=document.getElementById('teams');w.innerHTML='';teams.forEach((t,i)=>{const s=[];if(t.double)s.push('2×');if(t.shield)s.push('🛡 Shield');if(t.skip)s.push('Skip');if(t.freeHint)s.push('💡 Hint');if(t.hot)s.push(`🔥 ${t.hot}`);if(t.safePenalty)s.push('🕊 Safe');if(t.stealShield)s.push('🚫 Steal');if(t.secondChance)s.push('🙏 Retry');if(t.helper)s.push('📖 Helper');const d=document.createElement('div');d.className='team'+(i===activeTeam?' active':'');d.onclick=()=>{activeTeam=i;save();renderTeams()};d.innerHTML=`<div class="team-row"><div class="avatar" onclick="event.stopPropagation();cycleAvatar(${i})">${t.avatar||avatars[i%avatars.length]}</div><div class="team-name" contenteditable="true" onblur="renameTeam(${i},this.textContent)">${esc(t.name)}</div>${i===activeTeam?'<div class="turn">ACTIVE</div>':''}</div><div class="score">${t.score}</div><div class="statuses">${s.map(x=>`<span class="status">${x}</span>`).join('')}</div><div class="controls"><button class="mini" onclick="event.stopPropagation();changeScore(${i},-100)">−100</button><button class="mini" onclick="event.stopPropagation();changeScore(${i},100)">+100</button><button class="mini" onclick="event.stopPropagation();changeScore(${i},500)">+500</button><button class="mini" onclick="event.stopPropagation();removeTeam(${i})">✕</button></div>`;w.appendChild(d)});document.getElementById('turnBadge').textContent=`${teams[activeTeam]?.name||'Team'}'s turn`}
function cycleAvatar(i){const n=avatars.indexOf(teams[i].avatar);teams[i].avatar=avatars[(n+1)%avatars.length];save();renderTeams()}function renameTeam(i,n){teams[i].name=n.trim()||`Team ${i+1}`;save();renderTeams()}function addTeam(){teams.push({name:`Team ${teams.length+1}`,score:0,avatar:avatars[teams.length%avatars.length],streak:0});save();renderTeams();log('A new challenger entered.')}function removeTeam(i){if(teams.length<=1)return toast('At least one team is required.');teams.splice(i,1);if(activeTeam>=teams.length)activeTeam=0;save();renderTeams()}function changeScore(i,n){teams[i].score+=n;save();renderTeams();log(`${teams[i].name} ${n>=0?'gained':'lost'} ${Math.abs(n)}.`)}function nextTurn(){if(teams[activeTeam]?.skip){teams[activeTeam].skip=false;log(`${teams[activeTeam].name} skipped a turn.`)}activeTeam=(activeTeam+1)%teams.length;save();renderTeams()}
function openCard(i){currentIndex=i;const q=game.questions[i];if(q.type==='mystery'){openEvent();return}qCategory.textContent=q.category;qMeta.textContent=q.type==='minus'?`PENALTY • CORRECT +${Math.abs(q.points)} • WRONG -${Math.abs(q.points)}`:`${q.type.toUpperCase()} • ${Math.abs(q.points)} POINTS`;qText.textContent=q.question;qAnswer.textContent='Answer: '+q.answer;qHint.textContent='Hint: '+(q.hint||'No hint');qAnswer.classList.remove('show');qHint.classList.remove('show');stealPanel.style.display='none';selectedSteal=null;openModal('questionModal')}function showAnswer(){qAnswer.classList.add('show')}function showHint(){const t=teams[activeTeam];if(t.freeHint)t.freeHint=false;qHint.classList.add('show');save();renderTeams()}function calcPoints(q,t){let p=Math.abs(q.points);if(t.double){p*=2;t.double=false}if(t.hot){p+=100;t.hot--;if(!t.hot)delete t.hot}return p}
function awardCorrect(){const q=game.questions[currentIndex],t=teams[activeTeam],p=calcPoints(q,t);t.streak=(t.streak||0)+1;let b=t.streak>=3?100:0;t.score+=p+b;if(b)toast('3-answer streak! +100');log(`${t.name} scored ${p+b} points.`);finishCard()}function markWrong(){const q=game.questions[currentIndex],t=teams[activeTeam];t.streak=0;if(t.secondChance){t.secondChance=false;save();renderTeams();toast('Second Chance: answer again before a steal.');log(`${t.name} used a Second Chance.`);return}if(q.type==='minus'){const p=Math.abs(q.points);if(t.safePenalty){t.safePenalty=false;log(`${t.name}'s Safe Passage prevented a ${p}-point loss.`)}else if(t.shield){t.shield=false;log(`${t.name}'s shield blocked ${p}.`)}else{t.score-=p;log(`${t.name} lost ${p}.`)}finishCard()}else if(t.stealShield){t.stealShield=false;log(`${t.name}'s Steal Shield closed the steal.`);finishCard()}else{log(`${t.name} missed. Steal is open.`);save();renderTeams();openStealPanel()}}function openStealPanel(){stealPanel.style.display='block';stealTeams.innerHTML='';teams.forEach((t,i)=>{if(i===activeTeam)return;const b=document.createElement('button');b.className='choice';b.textContent=t.name;b.onclick=()=>{selectedSteal=i;[...stealTeams.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};stealTeams.appendChild(b)})}function resolveSteal(ok){if(selectedSteal===null)return toast('Choose a team.');const q=game.questions[currentIndex],t=teams[selectedSteal],p=q.type==='steal'?Math.abs(q.points):Math.max(100,Math.floor(Math.abs(q.points)*.5));if(ok){t.score+=p;log(`${t.name} stole ${p}.`)}else{if(t.shield)t.shield=false;else t.score-=Math.max(100,Math.floor(p/2));log(`${t.name} failed the steal.`)}finishCard()}function finishCard(){if(!used.includes(currentIndex))used.push(currentIndex);save();renderBoard();renderTeams();closeModal('questionModal');nextTurn()}
function openEvent(){eventResolved=false;eventIcon.textContent='🎁';eventTitle.textContent='Open it?';eventText.textContent='Anything can happen.';revealBtn.style.display='inline-block';openModal('eventModal')}function revealEvent(){if(eventResolved)return;eventResolved=true;const e=events[Math.floor(Math.random()*events.length)];eventIcon.textContent=e.icon;eventTitle.textContent=e.title;eventText.textContent=e.text;revealBtn.style.display='none';applyEvent(e)}function chooseTeam(msg){const list=teams.map((t,i)=>`${i+1}: ${t.name}`).join('\n');const n=Number(prompt(msg+'\n'+list))-1;return n>=0&&n<teams.length?n:null}function applyEvent(e){
 const t=teams[activeTeam];let finalText=e.text;
 if(e.action==='double')t.double=true;
 if(e.action==='add')t.score+=e.value;
 if(e.action==='minus'){if(t.shield){t.shield=false;finalText=`${t.name}'s shield blocked the ${e.value}-point trap.`}else t.score-=e.value}
 if(e.action==='skip')t.skip=true;
 if(e.action==='shield')t.shield=true;
 if(e.action==='hint')t.freeHint=true;
 if(e.action==='hot')t.hot=2;
 if(e.action==='safePenalty')t.safePenalty=true;
 if(e.action==='stealShield')t.stealShield=true;
 if(e.action==='secondChance')t.secondChance=true;
 if(e.action==='helper')t.helper=true;
 if(e.action==='playAgain')t.playAgain=true;
 if(e.action==='steal'){const o=chooseTeam('Choose a team to steal from:');if(o!==null&&o!==activeTeam){const a=Math.min(e.value,Math.max(0,teams[o].score));teams[o].score-=a;t.score+=a;finalText=`${t.name} stole ${a} points from ${teams[o].name}.`}else finalText='No team was selected, so no points changed.'}
 if(e.action==='giftPlus'){const o=chooseTeam('Choose a team to receive 100 points:');if(o!==null&&o!==activeTeam){teams[o].score+=e.give;t.score+=e.gain;finalText=`${teams[o].name} received ${e.give} points and ${t.name} gained ${e.gain} points.`}else{t.score+=e.gain;finalText=`No recipient was selected. ${t.name} still gained ${e.gain} points.`}}
 if(e.action==='bonusChallenge'){const qs=[['Complete the verse: “It is ____.”','finished'],['How many stations are in the procession of the Cross?','12'],['Who received the promise of Paradise on the Cross?','The right-hand thief'],['Which station is before the immersion font?','Station 10']];const pick=qs[Math.floor(Math.random()*qs.length)];const ans=prompt('BONUS CHALLENGE — 200 POINTS\n\n'+pick[0]);if(ans!==null&&ans.trim().toLowerCase()===pick[1].toLowerCase()){t.score+=200;finalText='Correct! Your team gained 200 points.'}else{finalText=`No points were lost. Correct answer: ${pick[1]}.`}}
 document.getElementById('eventText').textContent=finalText;
 log(`${t.name} revealed ${e.title}.`);save();renderTeams()
}function closeEvent(){if(eventResolved&&!used.includes(currentIndex))used.push(currentIndex);const again=teams[activeTeam]?.playAgain;if(again)teams[activeTeam].playAgain=false;save();renderBoard();closeModal('eventModal');if(eventResolved&&!again)nextTurn();if(again){renderTeams();toast('Play Again: choose another card now.');log(`${teams[activeTeam].name} earned another turn.`)}}
function openFinalBoss(){bossQuestion.textContent=game.bossQuestion;bossAnswer.textContent='Answer: '+game.bossAnswer;bossAnswer.classList.remove('show');wagers.innerHTML='';teams.forEach((t,i)=>{const d=document.createElement('div');d.className='wager';d.innerHTML=`<strong>${esc(t.name)}</strong><label style="margin-top:8px">Wager</label><input id="wg${i}" type="number" min="0" max="${Math.max(0,t.score)}" value="0"><label style="margin-top:8px">Result</label><select id="wr${i}"><option value="correct">Correct</option><option value="wrong">Wrong</option></select>`;wagers.appendChild(d)});openModal('bossModal')}function scoreBoss(){teams.forEach((t,i)=>{const w=Math.max(0,Math.min(Number(document.getElementById('wg'+i).value)||0,Math.max(0,t.score))),ok=document.getElementById('wr'+i).value==='correct';t.score+=ok?w:-w;log(`${t.name} ${ok?'won':'lost'} ${w} in Final Boss.`)});save();renderTeams();toast('Final Boss scored!')}
function openEditor(){editTitle.value=game.title;editBossQ.value=game.bossQuestion;editBossA.value=game.bossAnswer;renderEditor();openModal('editorModal')}function renderEditor(){editList.innerHTML='';game.questions.forEach((q,i)=>{const d=document.createElement('div');d.className='edit-row';d.innerHTML=`<input data-i="${i}" data-f="category" value="${attr(q.category)}" placeholder="Category"><input data-i="${i}" data-f="points" type="number" value="${q.points}" placeholder="Points"><select data-i="${i}" data-f="type"><option value="normal" ${q.type==='normal'?'selected':''}>Normal</option><option value="hard" ${q.type==='hard'?'selected':''}>Hard</option><option value="mystery" ${q.type==='mystery'?'selected':''}>Mystery</option><option value="steal" ${q.type==='steal'?'selected':''}>Steal</option><option value="minus" ${q.type==='minus'?'selected':''}>Minus</option><option value="bonus" ${q.type==='bonus'?'selected':''}>Bonus</option><option value="battle" ${q.type==='battle'?'selected':''}>Battle</option></select><input data-i="${i}" data-f="hint" value="${attr(q.hint||'')}" placeholder="Hint"><button class="btn red" onclick="deleteCard(${i})">Delete</button><textarea data-i="${i}" data-f="question" placeholder="Question">${esc(q.question)}</textarea><textarea data-i="${i}" data-f="answer" placeholder="Answer">${esc(q.answer)}</textarea>`;editList.appendChild(d)})}function addCard(){game.questions.push({category:'New Category',points:100,type:'normal',question:'New question',answer:'Answer',hint:'Hint'});renderEditor()}function deleteCard(i){game.questions.splice(i,1);renderEditor()}function saveEditor(){document.querySelectorAll('#editList [data-f]').forEach(el=>{const i=+el.dataset.i,f=el.dataset.f;game.questions[i][f]=f==='points'?+el.value:el.value});game.title=editTitle.value.trim()||'Quest Arena Deluxe';game.bossQuestion=editBossQ.value.trim();game.bossAnswer=editBossA.value.trim();used=[];save();renderBoard();closeModal('editorModal');toast('Game saved.')}function exportGame(){const a=document.createElement('a'),b=new Blob([JSON.stringify(game,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='the-cross-challenge.json';a.click();URL.revokeObjectURL(a.href)}function importGame(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{game=JSON.parse(r.result);used=[];save();renderBoard();openEditor();toast('Imported.')}catch{toast('Could not import.')}};r.readAsText(f)}function resetGame(){if(!confirm('Reset all scores and reopen every card?'))return;teams.forEach(t=>Object.assign(t,{score:0,streak:0,double:false,shield:false,skip:false,freeHint:false,hot:0,safePenalty:false,stealShield:false,secondChance:false,helper:false,playAgain:false}));used=[];activeTeam=0;save();renderBoard();renderTeams();log('Game reset.')}function openModal(id){document.getElementById(id).classList.add('show')}function closeModal(id){document.getElementById(id).classList.remove('show')}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function attr(s=''){return esc(s)}document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show')}));renderBoard();renderTeams();log('Quest Arena is ready.');
</script></body></html>
